<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <title>Check-in EducaTangará</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;
      padding:20px;

      font-family:Arial,sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef4ff,
          #dfe8f5
        );

      min-height:100vh;

    }

    h1{

      text-align:center;

      color:#0b3b6e;

      font-size:42px;

      margin-bottom:15px;

    }

    .evento{

      text-align:center;

      font-size:24px;

      font-weight:bold;

      color:#444;

      margin-bottom:25px;

    }

    .cameraContainer{

      width:100%;

      max-width:700px;

      margin:auto;

      border-radius:24px;

      overflow:hidden;

      background:black;

      min-height:420px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.20);

    }

    #reader{

      width:100%;

      min-height:420px;

      aspect-ratio:1/1;

      overflow:hidden;

      border-radius:24px;

    }

    #reader video{

      width:100% !important;

      height:auto !important;

      min-height:420px;

      object-fit:cover;

      border-radius:24px;

    }

    .cameraBox{

      text-align:center;

      margin-top:20px;

    }

    .btnCamera{

      background:#0d6efd;

      color:white;

      border:none;

      padding:18px 30px;

      border-radius:18px;

      font-size:24px;

      font-weight:bold;

      cursor:pointer;

      box-shadow:
        0 8px 20px rgba(13,110,253,0.25);

    }

    .status{

      margin:30px auto;

      max-width:700px;

      min-height:260px;

      border-radius:24px;

      background:white;

      display:flex;

      align-items:center;

      justify-content:center;

      text-align:center;

      padding:25px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.10);

    }

    .aguardando{

      color:#666;

      font-size:30px;

      font-weight:bold;

    }

    .card{

      width:100%;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:12px;

    }

    .foto{

      width:150px;

      height:150px;

      border-radius:50%;

      object-fit:cover;

      border:5px solid white;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.20);

    }

    .nome{

      font-size:38px;

      font-weight:bold;

    }

    .cargo{

      font-size:24px;

    }

    .escola{

      font-size:22px;

    }

    .mensagem{

      margin-top:15px;

      font-size:36px;

      font-weight:bold;

    }

    .sucesso{

      background:#198754;

      color:white;

    }

    .duplicado{

      background:#ffc107;

      color:#222;

    }

    .erro{

      background:#dc3545;

      color:white;

    }

    @media(max-width:700px){

      h1{
        font-size:34px;
      }

      .nome{
        font-size:28px;
      }

      .mensagem{
        font-size:28px;
      }

      .cargo,
      .escola{
        font-size:20px;
      }

      .btnCamera{
        width:100%;
      }

    }

    /* ESCONDER ELEMENTOS FEIOS */

    select,
    input[type="file"],
    #reader__status_span,
    #reader__dashboard_section_csr{

      display:none !important;

    }

    #reader__scan_region{

      border:none !important;

      background:none !important;

    }

  </style>

</head>

<body>

  <h1>
    📷 Check-in de Presença
  </h1>

  <div
    class="evento"
    id="eventoNome"
  >

    Evento carregado

  </div>

  <div class="cameraContainer">

    <div id="reader"></div>

  </div>

  <div class="cameraBox">

    <button
      class="btnCamera"
      onclick="iniciarCamera()"
    >

      📷 Ativar câmera

    </button>

  </div>

  <div
    class="status"
    id="status"
  >

    <div class="aguardando">

      📷 Aguardando leitura...

    </div>

  </div>

  <script>

    let scanning = false;

    let qrScanner = null;

    // ============================================
    // PARAMETROS URL
    // ============================================

    const params = new URLSearchParams(
      window.location.search
    );

    const eventoAtual =
      params.get('id') || '';

    const tipoCheckin =
      params.get('tipo') || 'evento';

    // ============================================
    // SOM
    // ============================================

    function tocarSom(tipo){

      const audio = new Audio(

        tipo === 'sucesso'

        ?

        'https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg'

        :

        'https://actions.google.com/sounds/v1/alarms/beep_short.ogg'

      );

      audio.play();

    }

    // ============================================
    // STATUS
    // ============================================

    function mostrarStatus(resposta){

      const status =
        document.getElementById(
          'status'
        );

      status.className =
        'status ' + resposta.tipo;

      status.innerHTML = `

        <div class="card">

          ${
            resposta.foto
            ?
            `
              <img
                src="${resposta.foto}"
                class="foto"
              >
            `
            :
            ''
          }

          <div class="nome">
            ${resposta.nome || ''}
          </div>

          <div class="cargo">
            ${resposta.cargo || ''}
          </div>

          <div class="escola">
            ${resposta.escola || ''}
          </div>

          <div class="mensagem">
            ${resposta.mensagem}
          </div>

        </div>

      `;

    }

    // ============================================
    // RESETAR
    // ============================================

    function resetarTela(){

      const status =
        document.getElementById(
          'status'
        );

      status.className = 'status';

      status.innerHTML = `

        <div class="aguardando">

          📷 Aguardando leitura...

        </div>

      `;

    }

    // ============================================
    // INICIAR CAMERA
    // ============================================

    function iniciarCamera(){

      try{

        if(qrScanner){
          return;
        }

        document.querySelector(
          '.btnCamera'
        ).disabled = true;

        qrScanner =

          new Html5QrcodeScanner(

            "reader",

            {

              fps:10,

              aspectRatio:1,

              qrbox:{
                width:250,
                height:250
              },

              rememberLastUsedCamera:false,

              supportedScanTypes:[
                Html5QrcodeScanType.SCAN_TYPE_CAMERA
              ]

            },

            false

          );

        qrScanner.render(

          function(decodedText){

            if(scanning){
              return;
            }

            scanning = true;

            if(navigator.vibrate){
              navigator.vibrate(200);
            }

            processarQR(decodedText);

            setTimeout(function(){

              scanning = false;

            },2500);

          },

          function(error){

            // ignorar erros contínuos

          }

        );

      }

      catch(erro){

        console.error(erro);

        alert(
          'Erro ao acessar câmera.'
        );

      }

    }

    // ============================================
    // PROCESSAR QR
    // ============================================

    function processarQR(idServidor){

      // TEMPORARIO
      // depois vamos ligar no Apps Script via fetch()

      mostrarStatus({

        tipo:'sucesso',

        nome:'Servidor Encontrado',

        cargo:'Professor(a)',

        escola:'Escola Municipal',

        mensagem:'✅ Presença registrada!',

        foto:'https://i.pravatar.cc/300'

      });

      tocarSom('sucesso');

      setTimeout(function(){

        resetarTela();

        scanning = false;

      },2000);

    }

  </script>

</body>

</html>
